<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Barbell bar -->
  <rect x="8" y="29" width="48" height="6" rx="3" fill="#FFD40A"/>
  <!-- Left weight plate -->
  <rect x="4" y="20" width="10" height="24" rx="2" fill="#FFD40A"/>
  <rect x="6" y="22" width="6" height="20" rx="1" fill="#E6BE09"/>
  <!-- Right weight plate -->
  <rect x="50" y="20" width="10" height="24" rx="2" fill="#FFD40A"/>
  <rect x="52" y="22" width="6" height="20" rx="1" fill="#E6BE09"/>
  <!-- Fist (centered on barbell) -->
  <g transform="translate(22, 16)">
    <!-- Fist base / palm -->
    <rect x="2" y="10" width="16" height="12" rx="3" fill="#F5F5F5"/>
    <!-- Thumb -->
    <rect x="0" y="14" width="5" height="7" rx="2.5" fill="#E8E8E8"/>
    <!-- Knuckles -->
    <rect x="2" y="8" width="4" height="6" rx="2" fill="#E8E8E8"/>
    <rect x="6" y="6" width="4" height="8" rx="2" fill="#F0F0F0"/>
    <rect x="10" y="7" width="4" height="7" rx="2" fill="#E8E8E8"/>
    <rect x="14" y="9" width="4" height="5" rx="2" fill="#F0F0F0"/>
  </g>
  <!-- "99" text -->
  <text x="32" y="56" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="10" fill="#FFD40A">99</text>
</svg>
