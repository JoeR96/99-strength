# Overrides for the Phase 9 live walkthrough (docs/v2/audit-after.md). Not used in production.
#
#   docker compose -p a2s-walkthrough --env-file <file with POSTGRES_PASSWORD> \
#     -f docker-compose.yml -f docker-compose.walkthrough.yml up -d --build
#
# The API is published on loopback only, and the Vite preview origin is added to CORS.
services:
  api:
    ports: !override
      - "127.0.0.1:${A2S_API_PORT:-8080}:8080"
    environment:
      Cors__Origins__2: "http://localhost:${A2S_WEB_PORT:-4173}"
      Cors__Origins__3: "http://127.0.0.1:${A2S_WEB_PORT:-4173}"
