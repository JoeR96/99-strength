name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Domain + Application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore A2S.sln
      - run: dotnet build A2S.sln --no-restore -c Release
      - run: dotnet test tests/A2S.Domain.Tests --no-build -c Release --logger "trx;LogFileName=domain.trx"
      - run: dotnet test tests/A2S.Application.Tests --no-build -c Release --logger "trx;LogFileName=application.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: '**/TestResults/*.trx'

  backend-integration:
    name: Infrastructure + API tests (Testcontainers)
    runs-on: ubuntu-latest
    # GitHub's ubuntu runners ship Docker, which Testcontainers uses to start postgres:16-alpine.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: docker pull postgres:16-alpine
      - run: dotnet restore A2S.sln
      - run: dotnet build A2S.sln --no-restore -c Release
      - run: dotnet test tests/A2S.Infrastructure.Tests --no-build -c Release --logger "trx;LogFileName=infrastructure.trx"
      - run: dotnet test tests/A2S.Api.Tests --no-build -c Release --logger "trx;LogFileName=api.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results
          path: '**/TestResults/*.trx'

  frontend:
    name: Vitest + build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/A2S.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/A2S.Web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          VITE_API_BASE_URL: http://localhost:5123/api/v1
      # Lint is reported but does not fail the build yet: master carries ~60 pre-existing problems.
      - run: npm run lint
        continue-on-error: true

  storybook:
    name: Storybook build + mobile a11y
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/A2S.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/A2S.Web/package-lock.json
      - run: npm ci
      - run: npm run build-storybook -- --quiet
      # Every page-level story on a 390 × 844 phone: no horizontal overflow, 44 px tap targets,
      # no serious/critical axe violations (tests/storybook/pages.spec.ts). Known defects are
      # expected failures listed in tests/storybook/known-issues.ts.
      # @storybook/test-runner is not a dependency of this project, so Playwright drives the
      # built stories directly through scripts/storybook-harness.mjs instead.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storybook
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-mobile-report
          path: |
            src/A2S.Web/playwright-report/storybook
            src/A2S.Web/test-results

  lighthouse:
    name: Lighthouse installability (PWA)
    runs-on: ubuntu-latest
    # /sign-in renders only Clerk's <SignIn/>, which paints nothing until clerk-js has loaded from
    # the Clerk frontend API, and Lighthouse aborts with NO_FCP on a blank page. So this job needs a
    # real publishable key: set the repository *variable* VITE_CLERK_PUBLISHABLE_KEY to the dev
    # instance's pk_test_… key (publishable keys ship in the bundle, so a variable, not a secret).
    # Until it is set the job is skipped and shows as such on the PR.
    if: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY != '' }}
    defaults:
      run:
        working-directory: src/A2S.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/A2S.Web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: http://localhost:5123/api/v1
      - run: npx vite preview --port 4173 --strictPort &
      - run: npx --yes wait-on@8 http://localhost:4173/sign-in --timeout 60000
      # Lighthouse 12 (lhci 0.14) dropped the PWA category and every installability audit except
      # `viewport`, so this pins lhci 0.13 (Lighthouse 11), the last release that still ships
      # installable-manifest, themed-omnibox, maskable-icon, splash-screen and content-width.
      # Assertions live in src/A2S.Web/lighthouserc.json: installability as errors, performance as a warning.
      - run: npx --yes @lhci/cli@0.13.x autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: src/A2S.Web/.lighthouseci
